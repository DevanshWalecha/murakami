[project]
name = "murakami"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevanshWalecha", email = "dev.work4971@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.36.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
murakami = "murakami:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
